{{- if .Values.storage.csi_driver_nfs.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Release.Name }}-data-sc
provisioner: nfs.csi.k8s.io
parameters:
  server: {{ .Values.storage.csi_driver_nfs.nfs_server | quote }}
  share: {{ .Values.storage.csi_driver_nfs.nfs_pytubedata_share | quote }}
  subDir: "."
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Release.Name }}-backup-sc
provisioner: nfs.csi.k8s.io
parameters:
  server: {{ .Values.storage.csi_driver_nfs.nfs_server | quote }}
  share: {{ .Values.storage.csi_driver_nfs.nfs_backup_share | quote }}
  subDir: "."
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Release.Name }}-data-sc
  resources:
    requests:
      storage: {{ .Values.storage.dataSize | default "5Gi" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres-backup-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Release.Name }}-backup-sc
  resources:
    requests:
      storage: {{ .Values.storage.backupSize | default "5Gi" }}
{{- end }}
---
{{- if .Values.postgres.csi_driver_nfs.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Release.Name }}-postgres-sc
provisioner: nfs.csi.k8s.io
parameters:
  server: {{ .Values.postgres.csi_driver_nfs.nfs_server | quote }}
  share: {{ .Values.postgres.csi_driver_nfs.nfs_share | quote }}
  subDir: "."
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
{{- end }}
