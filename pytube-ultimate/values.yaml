# ---------------------------------------------------------------------------
# Immagini: ora arrivano da GHCR (GitHub Container Registry), il registro
# Docker offerto gratuitamente da GitHub e collegato ai tuoi repository BE/FE.
# Sostituisci "carrimassimiliano" con il tuo owner/organizzazione GitHub se diverso.
# ---------------------------------------------------------------------------
backend:
  image:
    # FIX: era "pytube-backend", diverso dal repository realmente usato
    # nell'overlay ("pytube-app"). L'overlay vince comunque per precedenza
    # Helm, ma allineare il default evita confusione a chi guarda solo il
    # chart pubblicato o lo usa senza overlay.
    repository: ghcr.io/carrimassimiliano/pytube-app
    tag: latest
  imagePullPolicy: IfNotPresent

frontend:
  image:
    repository: ghcr.io/carrimassimiliano/pytube-frontend
    tag: latest
  imagePullPolicy: IfNotPresent

settings:
  silence_db: "-30dB"
  silence_duration: "1.5"

postgres:
  user: "postgres"
  db: "pytube_db"
  credentials_secret: ""
  # FIX: era "1G" (unità SI, decimale) mentre l'overlay usa "1Gi" (unità
  # binaria) — differenza di circa il 7%. Allineato per coerenza.
  storage: 1Gi
  csi_driver_nfs:
     enabled: true
     nfs_server: ""
     nfs_share: ""
  replicas: 1

storage:
  dataSize: 5Gi
  backupSize: 5Gi
  credentials_secret: "name_of_the_secret_to_be_created"
  credentials:
    - username: user1
      password: "bcrypted_passwd"
      folder: user1_data
    - username: user2
      password: "bcrypted_passwd"
      folder: user2_data
  csi_driver_nfs:
     enabled: true
     nfs_server: ""
     nfs_backup_share: ""
     nfs_pytubedata_share: ""

backup:
  schedule: "*/5 * * * *"
  retentionDays: 7
global: {}
